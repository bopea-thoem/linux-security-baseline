---
- name: Assert supported Red Hat Enterprise Linux platform for AIDE role
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == linux_security_baseline_target_distribution
      - ansible_facts.distribution_major_version | int in linux_security_baseline_aide_supported_major_versions
    fail_msg: >-
      Unsupported platform detected for aide role:
      {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.
    success_msg: >-
      Supported platform detected for aide role:
      {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.
  when: linux_security_baseline_aide_enabled | bool
  tags:
    - always
    - baseline
    - aide
    - aide_verify

- name: Install AIDE packages
  ansible.builtin.package:
    name: "{{ linux_security_baseline_aide_packages }}"
    state: present
    disable_gpg_check: "{{ ansible_facts.distribution_major_version | int >= 10 }}"
  when:
    - linux_security_baseline_aide_enabled | bool
    - linux_security_baseline_aide_install | bool
  tags:
    - baseline
    - aide
    - aide_package

- name: Ensure AIDE database directory exists
  ansible.builtin.file:
    path: "{{ linux_security_baseline_aide_database.path | dirname }}"
    state: directory
    owner: "{{ linux_security_baseline_aide_database.owner }}"
    group: "{{ linux_security_baseline_aide_database.group }}"
    mode: "{{ linux_security_baseline_aide_database.directory_mode }}"
  when:
    - linux_security_baseline_aide_enabled | bool
    - linux_security_baseline_aide_initialize | bool
  tags:
    - baseline
    - aide
    - aide_database

- name: Check active AIDE database
  ansible.builtin.stat:
    path: "{{ linux_security_baseline_aide_database.path }}"
  register: linux_security_baseline_aide_database_stat
  when:
    - linux_security_baseline_aide_enabled | bool
    - linux_security_baseline_aide_initialize | bool
  tags:
    - baseline
    - aide
    - aide_database

- name: Check newly initialized AIDE database
  ansible.builtin.stat:
    path: "{{ linux_security_baseline_aide_database.new_path }}"
  register: linux_security_baseline_aide_new_database_stat
  when:
    - linux_security_baseline_aide_enabled | bool
    - linux_security_baseline_aide_initialize | bool
  tags:
    - baseline
    - aide
    - aide_database

- name: Initialize AIDE database when no database exists
  ansible.builtin.command:
    cmd: "{{ linux_security_baseline_aide_binary }} --init"
    creates: "{{ linux_security_baseline_aide_database.new_path }}"
  register: linux_security_baseline_aide_initialize_result
  changed_when: linux_security_baseline_aide_initialize_result.rc == 0
  when:
    - linux_security_baseline_aide_enabled | bool
    - linux_security_baseline_aide_initialize | bool
    - not linux_security_baseline_aide_database_stat.stat.exists
    - not linux_security_baseline_aide_new_database_stat.stat.exists
  tags:
    - baseline
    - aide
    - aide_database

- name: Recheck newly initialized AIDE database
  ansible.builtin.stat:
    path: "{{ linux_security_baseline_aide_database.new_path }}"
  register: linux_security_baseline_aide_new_database_after_init_stat
  when:
    - linux_security_baseline_aide_enabled | bool
    - linux_security_baseline_aide_initialize | bool
  tags:
    - baseline
    - aide
    - aide_database

- name: Activate AIDE database without overwriting an existing database
  ansible.builtin.copy:
    src: "{{ linux_security_baseline_aide_database.new_path }}"
    dest: "{{ linux_security_baseline_aide_database.path }}"
    owner: "{{ linux_security_baseline_aide_database.owner }}"
    group: "{{ linux_security_baseline_aide_database.group }}"
    mode: "{{ linux_security_baseline_aide_database.mode }}"
    remote_src: true
    force: false
  when:
    - linux_security_baseline_aide_enabled | bool
    - linux_security_baseline_aide_initialize | bool
    - not linux_security_baseline_aide_database_stat.stat.exists
    - linux_security_baseline_aide_new_database_after_init_stat.stat.exists
  tags:
    - baseline
    - aide
    - aide_database

- name: Configure daily AIDE integrity check
  ansible.builtin.template:
    src: "{{ linux_security_baseline_aide_cron_template }}"
    dest: "{{ linux_security_baseline_aide_cron.path }}"
    owner: "{{ linux_security_baseline_aide_cron.owner }}"
    group: "{{ linux_security_baseline_aide_cron.group }}"
    mode: "{{ linux_security_baseline_aide_cron.mode }}"
  notify: Restart crond
  when:
    - linux_security_baseline_aide_enabled | bool
    - linux_security_baseline_aide_configure_daily_check | bool
  tags:
    - baseline
    - aide
    - aide_cron

- name: Import AIDE verification tasks
  ansible.builtin.import_tasks: verify.yml
  when: linux_security_baseline_aide_enabled | bool
  tags:
    - baseline
    - aide
    - aide_verify
    - verify
