---
- name: Check Red Hat release GPG key source file for verification
  ansible.builtin.stat:
    path: "{{ linux_security_baseline_gpg_redhat_release_key.path }}"
  register: linux_security_baseline_gpg_verify_key_source_stat
  when:
    - linux_security_baseline_gpg_verify | bool
    - linux_security_baseline_gpg_manage_redhat_release_key | bool
  tags:
    - baseline
    - gpg
    - gpg_verify
    - verify

- name: Assert Red Hat release GPG key source is available for verification
  ansible.builtin.assert:
    that:
      - >-
        linux_security_baseline_gpg_verify_key_source_stat.stat.exists
        or linux_security_baseline_gpg_allow_remote_key_source | bool
    fail_msg: >-
      Red Hat release GPG key source file was not found at
      {{ linux_security_baseline_gpg_redhat_release_key.path }} and remote key
      fallback is disabled.
  when:
    - linux_security_baseline_gpg_verify | bool
    - linux_security_baseline_gpg_manage_redhat_release_key | bool
  tags:
    - baseline
    - gpg
    - gpg_verify
    - verify

- name: Verify Red Hat release GPG key remains installed
  ansible.builtin.rpm_key:
    key: >-
      {{
        linux_security_baseline_gpg_redhat_release_key.path
        if linux_security_baseline_gpg_verify_key_source_stat.stat.exists
        else linux_security_baseline_gpg_redhat_release_key.url
      }}
    fingerprint: "{{ linux_security_baseline_gpg_redhat_release_key_fingerprints[0] }}"
    state: present
    validate_certs: "{{ linux_security_baseline_gpg_redhat_release_key.validate_certs | bool }}"
  check_mode: true
  register: linux_security_baseline_gpg_redhat_release_key_verify_result
  failed_when:
    - linux_security_baseline_gpg_verify_fail_on_drift | bool
    - linux_security_baseline_gpg_redhat_release_key_verify_result.changed | default(false)
  when:
    - linux_security_baseline_gpg_verify | bool
    - linux_security_baseline_gpg_manage_redhat_release_key | bool
  tags:
    - baseline
    - gpg
    - gpg_verify
    - verify
