---
linux_security_baseline_process_hardening_enabled: true
linux_security_baseline_process_hardening_manage_limits: true
linux_security_baseline_process_hardening_manage_sysctl: true
linux_security_baseline_process_hardening_verify: true
linux_security_baseline_process_hardening_verify_fail_on_drift: true

linux_security_baseline_process_hardening_limits_file:
  path: /etc/security/limits.conf
  owner: root
  group: root
  mode: "0644"

linux_security_baseline_process_hardening_limits:
  - domain: "*"
    limit_type: hard
    limit_item: core
    value: "0"
  - domain: "*"
    limit_type: soft
    limit_item: core
    value: "0"

linux_security_baseline_process_hardening_sysctl_file: /etc/sysctl.conf
linux_security_baseline_process_hardening_sysctl_settings:
  - name: fs.suid_dumpable
    value: "0"

linux_security_baseline_process_hardening_tags:
  - baseline
  - process_hardening
