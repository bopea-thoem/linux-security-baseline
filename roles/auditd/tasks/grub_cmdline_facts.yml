---
- name: Check GRUB default file
  ansible.builtin.stat:
    path: "{{ linux_security_baseline_auditd_grub_file.path }}"
  register: linux_security_baseline_auditd_grub_file_stat

- name: Read GRUB default file
  ansible.builtin.slurp:
    src: "{{ linux_security_baseline_auditd_grub_file.path }}"
  register: linux_security_baseline_auditd_grub_slurp
  when: linux_security_baseline_auditd_grub_file_stat.stat | default({'exists': false}).exists

- name: Set current GRUB_CMDLINE_LINUX value
  ansible.builtin.set_fact:
    linux_security_baseline_auditd_grub_cmdline_current: >-
      {{
        (
          (
            linux_security_baseline_auditd_grub_slurp
            | default({})
          ).content
          | default('')
          | b64decode
          | regex_search('(?m)^GRUB_CMDLINE_LINUX=.*$')
          | default('GRUB_CMDLINE_LINUX=""', true)
        )
        | regex_replace('^GRUB_CMDLINE_LINUX=', '')
        | trim
        | regex_replace('^"', '')
        | regex_replace('"$', '')
        | regex_replace("^'", '')
        | regex_replace("'$", '')
      }}

- name: Set effective GRUB_CMDLINE_LINUX value
  ansible.builtin.set_fact:
    linux_security_baseline_auditd_grub_cmdline_effective: >-
      {{
        (
          linux_security_baseline_auditd_grub_cmdline_current
          if linux_security_baseline_auditd_grub_audit_argument
          in (
            linux_security_baseline_auditd_grub_cmdline_current
            | regex_replace('\\s+', ' ')
            | trim
            | split(' ')
          )
          else (
            linux_security_baseline_auditd_grub_cmdline_current
            | regex_replace(
              '(?<!\\S)rhgb(?!\\S)',
              linux_security_baseline_auditd_grub_audit_argument ~ ' rhgb'
            )
            if 'rhgb'
            in (
              linux_security_baseline_auditd_grub_cmdline_current
              | regex_replace('\\s+', ' ')
              | trim
              | split(' ')
            )
            else (
              linux_security_baseline_auditd_grub_cmdline_current
              ~ ' '
              ~ linux_security_baseline_auditd_grub_audit_argument
            )
          )
        )
        | trim
      }}
