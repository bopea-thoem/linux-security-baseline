---
linux_security_baseline_auditd_domain: auditd
linux_security_baseline_auditd_supported_major_versions:
  - 7
  - 8
  - 9
  - 10

linux_security_baseline_auditd_config_content: |
  # Ansible managed: Linux Security Baseline auditd configuration.

  write_logs = {{ linux_security_baseline_auditd_config.write_logs | bool | ternary('yes', 'no') }}
  log_file = {{ linux_security_baseline_auditd_config.log_file }}
  log_format = {{ linux_security_baseline_auditd_config.log_format }}
  log_group = {{ linux_security_baseline_auditd_config.log_group }}
  priority_boost = {{ linux_security_baseline_auditd_config.priority_boost }}
  flush = {{ linux_security_baseline_auditd_config.flush }}
  freq = {{ linux_security_baseline_auditd_config.freq }}
  num_logs = {{ linux_security_baseline_auditd_config.num_logs }}
  disp_qos = {{ linux_security_baseline_auditd_config.disp_qos }}
  dispatcher = {{ linux_security_baseline_auditd_config.dispatcher }}
  name_format = {{ linux_security_baseline_auditd_config.name_format }}
  max_log_file = {{ linux_security_baseline_auditd_config.max_log_file }}
  max_log_file_action = {{ linux_security_baseline_auditd_config.max_log_file_action }}
  space_left = {{ linux_security_baseline_auditd_config.space_left }}
  space_left_action = {{ linux_security_baseline_auditd_config.space_left_action }}
  action_mail_acct = {{ linux_security_baseline_auditd_config.action_mail_acct }}
  admin_space_left = {{ linux_security_baseline_auditd_config.admin_space_left }}
  admin_space_left_action = {{ linux_security_baseline_auditd_config.admin_space_left_action }}
  disk_full_action = {{ linux_security_baseline_auditd_config.disk_full_action }}
  disk_error_action = {{ linux_security_baseline_auditd_config.disk_error_action }}
  tcp_listen_queue = {{ linux_security_baseline_auditd_config.tcp_listen_queue }}
  tcp_max_per_addr = {{ linux_security_baseline_auditd_config.tcp_max_per_addr }}
  tcp_client_max_idle = {{ linux_security_baseline_auditd_config.tcp_client_max_idle }}
  enable_krb5 = {{ linux_security_baseline_auditd_config.enable_krb5 | bool | ternary('yes', 'no') }}
  krb5_principal = {{ linux_security_baseline_auditd_config.krb5_principal }}

linux_security_baseline_auditd_base_rules_content: |
  ## Ansible managed: Linux Security Baseline audit control rules.

  -b {{ linux_security_baseline_auditd_control_rules.backlog_limit }}
  -f {{ linux_security_baseline_auditd_control_rules.failure_mode }}
  -r {{ linux_security_baseline_auditd_control_rules.rate_limit }}
  --backlog_wait_time {{ linux_security_baseline_auditd_control_rules.backlog_wait_time }}

linux_security_baseline_auditd_main_rules_content: |
  ## Ansible managed: Linux Security Baseline audit rules.

  {% for result in linux_security_baseline_auditd_watch_path_stats.results | default([]) %}
  {% if result.stat.exists %}
  -w {{ result.item.path }} -p {{ result.item.permissions }} -k {{ result.item.key }}
  {% endif %}
  {% endfor %}
  {% for rule in linux_security_baseline_auditd_arch_syscall_rules %}
  {% for arch in linux_security_baseline_auditd_architectures %}
  {% if rule.syscalls_by_arch is defined %}
  {% set syscalls = rule.syscalls_by_arch[arch] | default([]) %}
  {% else %}
  {% set syscalls = rule.syscalls | default([]) %}
  {% endif %}
  {% if syscalls | length > 0 %}
  {% set syscall_args = [] %}
  {% for syscall in syscalls %}
  {% set _ = syscall_args.append('-S ' ~ syscall) %}
  {% endfor %}
  {% set filter_args = [] %}
  {% for filter in rule.filters | default([]) %}
  {% set normalized_filter = filter | replace('1000', linux_security_baseline_auditd_uid_min | string) %}
  {% set normalized_filter = normalized_filter | replace('4294967295', linux_security_baseline_auditd_unset_auid) %}
  {% set _ = filter_args.append('-F ' ~ normalized_filter) %}
  {% endfor %}
  {% set audit_rule = '-a ' ~ rule.action ~ ' -F arch=' ~ arch %}
  {% set audit_rule = audit_rule ~ ' ' ~ (syscall_args | join(' ')) %}
  {% if filter_args | length > 0 %}
  {% set audit_rule = audit_rule ~ ' ' ~ (filter_args | join(' ')) %}
  {% endif %}
  {{ audit_rule }} -k {{ rule.key }}
  {% endif %}
  {% endfor %}
  {% endfor %}
  {% set emitted_exec_paths = [] %}
  {% for result in linux_security_baseline_auditd_exec_path_stats.results | default([]) %}
  {% if result.stat.exists %}
  {% set _ = emitted_exec_paths.append(result.item.path) %}
  {% set auid_args = '-F auid>=' ~ linux_security_baseline_auditd_uid_min %}
  {% set auid_args = auid_args ~ ' -F auid!=' ~ linux_security_baseline_auditd_unset_auid %}
  -a always,exit -F path={{ result.item.path }} -F perm=x {{ auid_args }} -k {{ result.item.key }}
  {% endif %}
  {% endfor %}
  {% for result in linux_security_baseline_auditd_discovered_exec_paths.results | default([]) %}
  {% for path in result.stdout_lines | default([]) | sort %}
  {% if path not in emitted_exec_paths %}
  {% set _ = emitted_exec_paths.append(path) %}
  {% set auid_args = '-F auid>=' ~ linux_security_baseline_auditd_uid_min %}
  {% set auid_args = auid_args ~ ' -F auid!=' ~ linux_security_baseline_auditd_unset_auid %}
  -a always,exit -F path={{ path }} -F perm=x {{ auid_args }} -k privileged
  {% endif %}
  {% endfor %}
  {% endfor %}

linux_security_baseline_auditd_finalize_rules_content: |
  ## Ansible managed: Linux Security Baseline audit finalize rules.

  -e 2

linux_security_baseline_auditd_legacy_rules_content: >-
  {{
    linux_security_baseline_auditd_base_rules_content
    ~ '\n'
    ~ linux_security_baseline_auditd_main_rules_content
    ~ (
      '\n' ~ linux_security_baseline_auditd_finalize_rules_content
      if linux_security_baseline_auditd_rules_immutable | bool
      else ''
    )
  }}
