---
- name: Assert supported Red Hat Enterprise Linux platform for cron role
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == linux_security_baseline_target_distribution
      - ansible_facts.distribution_major_version | int in linux_security_baseline_cron_supported_major_versions
    fail_msg: >-
      Unsupported platform detected for cron role:
      {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.
    success_msg: >-
      Supported platform detected for cron role:
      {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.
  when: linux_security_baseline_cron_enabled | bool
  tags:
    - always
    - baseline
    - cron
    - cron_verify

- name: Install cron and at packages
  ansible.builtin.package:
    name: "{{ linux_security_baseline_cron_packages }}"
    state: present
  when:
    - linux_security_baseline_cron_enabled | bool
    - linux_security_baseline_cron_install | bool
  tags:
    - baseline
    - cron
    - cron_package

- name: Configure cron files and directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: "{{ item.state }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ linux_security_baseline_cron_managed_paths }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - linux_security_baseline_cron_enabled | bool
    - linux_security_baseline_cron_manage_files | bool
  tags:
    - baseline
    - cron
    - cron_permissions

- name: Ensure cron and at allow files exist with secure ownership
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: touch
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
    modification_time: preserve
    access_time: preserve
  loop: "{{ linux_security_baseline_cron_allow_files }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - linux_security_baseline_cron_enabled | bool
    - linux_security_baseline_cron_manage_access | bool
  tags:
    - baseline
    - cron
    - cron_access

- name: Configure cron and at allowed users
  ansible.builtin.lineinfile:
    path: "{{ item.0.path }}"
    line: "{{ item.1 }}"
    owner: "{{ item.0.owner }}"
    group: "{{ item.0.group }}"
    mode: "{{ item.0.mode }}"
    create: true
  loop: "{{ linux_security_baseline_cron_allow_files | subelements('users') }}"
  loop_control:
    label: "{{ item.0.path }}:{{ item.1 }}"
  when:
    - linux_security_baseline_cron_enabled | bool
    - linux_security_baseline_cron_manage_access | bool
  tags:
    - baseline
    - cron
    - cron_access

- name: Remove cron and at deny files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ linux_security_baseline_cron_deny_files }}"
  loop_control:
    label: "{{ item }}"
  when:
    - linux_security_baseline_cron_enabled | bool
    - linux_security_baseline_cron_manage_access | bool
  tags:
    - baseline
    - cron
    - cron_access

- name: Import cron verification tasks
  ansible.builtin.import_tasks: verify.yml
  when: linux_security_baseline_cron_enabled | bool
  tags:
    - baseline
    - cron
    - cron_verify
    - verify
