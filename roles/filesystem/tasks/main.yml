---
- name: Ensure /dev/shm is mounted with hardened options
  ansible.posix.mount:
    path: "{{ linux_security_baseline_filesystem_dev_shm.path }}"
    src: "{{ linux_security_baseline_filesystem_dev_shm.src }}"
    fstype: "{{ linux_security_baseline_filesystem_dev_shm.fstype }}"
    opts: "{{ linux_security_baseline_filesystem_dev_shm_opts }}"
    dump: "{{ linux_security_baseline_filesystem_dev_shm.dump }}"
    passno: "{{ linux_security_baseline_filesystem_dev_shm.passno }}"
    boot: "{{ linux_security_baseline_filesystem_dev_shm.boot }}"
    state: mounted
  when:
    - linux_security_baseline_filesystem_enabled | bool
    - linux_security_baseline_filesystem_manage_dev_shm | bool
  tags:
    - baseline
    - filesystem
    - filesystem_dev_shm

- name: Configure disabled kernel module policy
  ansible.builtin.template:
    src: "{{ linux_security_baseline_filesystem_modprobe_template }}"
    dest: "{{ linux_security_baseline_filesystem_modprobe_conf.path }}"
    owner: "{{ linux_security_baseline_filesystem_modprobe_conf.owner }}"
    group: "{{ linux_security_baseline_filesystem_modprobe_conf.group }}"
    mode: "{{ linux_security_baseline_filesystem_modprobe_conf.mode }}"
  when:
    - linux_security_baseline_filesystem_enabled | bool
    - linux_security_baseline_filesystem_disable_modules | bool
  tags:
    - baseline
    - filesystem
    - filesystem_kernel_modules

- name: Unload disabled kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: absent
  loop: >-
    {{
      linux_security_baseline_filesystem_disabled_modules
      + linux_security_baseline_filesystem_disabled_install_true_modules
    }}
  loop_control:
    label: "{{ item }}"
  register: linux_security_baseline_filesystem_module_unload_result
  failed_when:
    - linux_security_baseline_filesystem_fail_on_module_unload_error | bool
    - linux_security_baseline_filesystem_module_unload_result is failed
  when:
    - linux_security_baseline_filesystem_enabled | bool
    - linux_security_baseline_filesystem_disable_modules | bool
    - linux_security_baseline_filesystem_unload_modules | bool
  tags:
    - baseline
    - filesystem
    - filesystem_kernel_modules

- name: Verify /dev/shm hardened mount state
  ansible.posix.mount:
    path: "{{ linux_security_baseline_filesystem_dev_shm.path }}"
    src: "{{ linux_security_baseline_filesystem_dev_shm.src }}"
    fstype: "{{ linux_security_baseline_filesystem_dev_shm.fstype }}"
    opts: "{{ linux_security_baseline_filesystem_dev_shm_opts }}"
    dump: "{{ linux_security_baseline_filesystem_dev_shm.dump }}"
    passno: "{{ linux_security_baseline_filesystem_dev_shm.passno }}"
    boot: "{{ linux_security_baseline_filesystem_dev_shm.boot }}"
    state: mounted
  check_mode: true
  register: linux_security_baseline_filesystem_dev_shm_verify_result
  failed_when:
    - linux_security_baseline_filesystem_verify_fail_on_drift | bool
    - linux_security_baseline_filesystem_dev_shm_verify_result.changed | default(false)
  when:
    - linux_security_baseline_filesystem_enabled | bool
    - linux_security_baseline_filesystem_verify | bool
    - linux_security_baseline_filesystem_manage_dev_shm | bool
  tags:
    - baseline
    - filesystem
    - filesystem_dev_shm
    - filesystem_verify
    - verify

- name: Verify disabled kernel module policy configuration
  ansible.builtin.template:
    src: "{{ linux_security_baseline_filesystem_modprobe_template }}"
    dest: "{{ linux_security_baseline_filesystem_modprobe_conf.path }}"
    owner: "{{ linux_security_baseline_filesystem_modprobe_conf.owner }}"
    group: "{{ linux_security_baseline_filesystem_modprobe_conf.group }}"
    mode: "{{ linux_security_baseline_filesystem_modprobe_conf.mode }}"
  check_mode: true
  register: linux_security_baseline_filesystem_modprobe_conf_verify_result
  failed_when:
    - linux_security_baseline_filesystem_verify_fail_on_drift | bool
    - linux_security_baseline_filesystem_modprobe_conf_verify_result.changed | default(false)
  when:
    - linux_security_baseline_filesystem_enabled | bool
    - linux_security_baseline_filesystem_verify | bool
    - linux_security_baseline_filesystem_disable_modules | bool
  tags:
    - baseline
    - filesystem
    - filesystem_kernel_modules
    - filesystem_verify
    - verify

- name: Verify disabled kernel modules are unloaded
  community.general.modprobe:
    name: "{{ item }}"
    state: absent
  loop: >-
    {{
      linux_security_baseline_filesystem_disabled_modules
      + linux_security_baseline_filesystem_disabled_install_true_modules
    }}
  loop_control:
    label: "{{ item }}"
  check_mode: true
  register: linux_security_baseline_filesystem_module_verify_result
  failed_when:
    - linux_security_baseline_filesystem_verify_fail_on_drift | bool
    - linux_security_baseline_filesystem_module_verify_result.changed | default(false)
  when:
    - linux_security_baseline_filesystem_enabled | bool
    - linux_security_baseline_filesystem_verify | bool
    - linux_security_baseline_filesystem_disable_modules | bool
    - linux_security_baseline_filesystem_unload_modules | bool
  tags:
    - baseline
    - filesystem
    - filesystem_kernel_modules
    - filesystem_verify
    - verify
