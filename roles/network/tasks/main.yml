---
- name: Assert supported Red Hat Enterprise Linux platform for network role
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == linux_security_baseline_target_distribution
      - ansible_facts.distribution_major_version | int in linux_security_baseline_network_supported_major_versions
    fail_msg: >-
      Unsupported platform detected for network role:
      {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.
    success_msg: >-
      Supported platform detected for network role:
      {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.
  when: linux_security_baseline_network_enabled | bool
  tags:
    - always
    - baseline
    - network
    - network_verify

- name: Configure IPv4 network sysctl settings
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: "{{ linux_security_baseline_network_sysctl_file }}"
    state: present
    sysctl_set: true
    reload: true
  loop: "{{ linux_security_baseline_network_ipv4_sysctl_settings }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - linux_security_baseline_network_enabled | bool
    - linux_security_baseline_network_manage_sysctl | bool
  tags:
    - baseline
    - network
    - network_sysctl

- name: Import network verification tasks
  ansible.builtin.import_tasks: verify.yml
  when: linux_security_baseline_network_enabled | bool
  tags:
    - baseline
    - network
    - network_verify
    - verify
